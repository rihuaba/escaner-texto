name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Poner los archivos nuevos en la carpeta www
        run: |
          [ -f index.html ] && cp index.html www/index.html
          [ -f worker.min.js ] && cp worker.min.js www/lib/worker.min.js
          [ -f spa.traineddata ] && cp spa.traineddata www/lang/spa.traineddata
          rm -f www/lang/eng.traineddata.gz www/lang/spa.traineddata.gz
          ls -la www www/lib www/lang

      - name: Instalar dependencias
        run: npm install

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EscanerDeTexto-1.2.0.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: EscanerDeTexto-APK-1.2.0
          path: EscanerDeTexto-1.2.0.apk
