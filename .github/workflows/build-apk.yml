name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Los archivos subidos sueltos a la raíz del repositorio se copian a su carpeta
      - name: Colocar archivos en su carpeta
        run: |
          J=android/app/src/main/java/com/escaner/texto
          M=android/app/src/main
          for f in *.java; do
            if [ -f "$f" ]; then cp "$f" "$J/$f"; fi
          done
          if [ -f AndroidManifest.xml ]; then cp AndroidManifest.xml "$M/AndroidManifest.xml"; fi
          if [ -f strings.xml ]; then cp strings.xml "$M/res/values/strings.xml"; fi
          if [ -f ic_tile.xml ]; then cp ic_tile.xml "$M/res/drawable/ic_tile.xml"; fi
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ -f worker.min.js ]; then cp worker.min.js www/lib/worker.min.js; fi
          if [ -f spa.traineddata ]; then cp spa.traineddata www/lang/spa.traineddata; fi
          rm -f www/lang/eng.traineddata.gz www/lang/spa.traineddata.gz
          ls -la "$J" www www/lang

      # Versión: se toma de version.txt (por ejemplo 1.4 -> código 104)
      - name: Versión
        run: |
          V=$(tr -d ' \r\n' < version.txt 2>/dev/null || true)
          if [ -z "$V" ]; then V=1.4; fi
          CODE=$(echo "$V" | awk -F. '{print $1*100 + $2}')
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Lector de texto de Google (ML Kit), funciona sin internet
      - name: Agregar ML Kit
        run: |
          if ! grep -q "mlkit:text-recognition" android/app/build.gradle; then
            sed -i 's#^dependencies {#dependencies {\n    implementation "com.google.mlkit:text-recognition:16.0.1"#' android/app/build.gradle
          fi
          sed -n '/^dependencies/,/^}/p' android/app/build.gradle

      # Firma fija: las versiones nuevas se instalan encima sin desinstalar
      - name: Clave de firma
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - name: Instalar dependencias
        run: npm install

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "EscanerDeTexto-$APP_VERSION.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: EscanerDeTexto-APK-${{ env.APP_VERSION }}
          path: EscanerDeTexto-*.apk
